<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Vitória Ferreira — Computer Engineering and Cybersecurity</title>
  <desc id="desc">Light lavender and purple profile banner with subtle circuit-inspired geometry.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf9ff"/>
      <stop offset="0.58" stop-color="#f2effa"/>
      <stop offset="1" stop-color="#e8ddfb"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="violetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <ellipse cx="1035" cy="68" rx="250" ry="168" fill="url(#violetGlow)" filter="url(#softBlur)"/>
  <ellipse cx="1110" cy="320" rx="210" ry="120" fill="url(#violetGlow)" opacity="0.5"/>

  <g fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.24">
    <path d="M830 42h124l35 35h137"/>
    <path d="M888 112h88l42 42h132"/>
    <path d="M812 294h96l46-46h196"/>
    <path d="M984 196h166"/>
    <circle cx="830" cy="42" r="4" fill="#7c3aed"/>
    <circle cx="888" cy="112" r="4" fill="#8b5cf6"/>
    <circle cx="812" cy="294" r="4" fill="#7c3aed"/>
    <circle cx="984" cy="196" r="4" fill="#8b5cf6"/>
  </g>

  <g opacity="0.62">
    <rect x="984" y="77" width="90" height="90" rx="20" fill="none" stroke="#7c3aed" transform="rotate(45 1029 122)"/>
    <rect x="1014" y="107" width="90" height="90" rx="20" fill="none" stroke="#8b5cf6" stroke-opacity="0.5" transform="rotate(45 1059 152)"/>
    <circle cx="1029" cy="122" r="8" fill="#7c3aed"/>
  </g>

  <rect x="76" y="60" width="270" height="30" rx="15" fill="#7c3aed" fill-opacity="0.08" stroke="#7c3aed" stroke-opacity="0.3"/>
  <circle cx="96" cy="75" r="4" fill="#7c3aed"/>
  <text x="110" y="80" fill="#5b21b6" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">LEARNING · BUILDING · SECURING</text>

  <text x="76" y="174" fill="#2e1065" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="750" letter-spacing="-1.8">Vitória Ferreira</text>
  <text x="79" y="222" fill="#5b21b6" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="600" letter-spacing="0.4">Computer Engineering · Cybersecurity · Python</text>
  <text x="79" y="270" fill="#4c425d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Building toward a career in cybersecurity, application security and cloud security.</text>

  <rect x="76" y="316" width="1048" height="2" rx="1" fill="url(#edge)"/>
